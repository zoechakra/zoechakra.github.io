name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel an in-flight deployment: a cancelled deploy-pages run can leave
# the Pages site in a half-published state. Queue instead.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.3"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Project site (user.github.io/repo) serves assets from /repo/.
      # User/org site (user.github.io) serves from /.
      # A CNAME file (custom domain) always serves from /.
      - name: Resolve base path
        id: base
        env:
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
        run: |
          NAME="${REPO#*/}"
          OWNER_LC="$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')"
          NAME_LC="$(echo "$NAME" | tr '[:upper:]' '[:lower:]')"
          if [[ -f public/CNAME || -f CNAME || "$NAME_LC" == "$OWNER_LC.github.io" ]]; then
            echo "path=/" >> "$GITHUB_OUTPUT"
          else
            echo "path=/$NAME/" >> "$GITHUB_OUTPUT"
          fi
          echo "Resolved base path: $(tail -n1 "$GITHUB_OUTPUT")"

      - name: Build static site
        env:
          STATIC_EXPORT: "1"
          BASE_PATH: ${{ steps.base.outputs.path }}
        run: bun run build

      - name: Prepare Pages artifact
        run: |
          set -euo pipefail
          test -f dist/client/index.html || {
            echo "::error::Static build produced no dist/client/index.html"
            ls -R dist || true
            exit 1
          }
          touch dist/client/.nojekyll
          # SPA fallback so deep links and refreshes resolve.
          cp dist/client/index.html dist/client/404.html
          ls -la dist/client

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
